# ============================================================
# Hexo 站点配置
# 你通常只需要改动下面【站点信息】和【网址】两处
# ============================================================

# ---------- 站点信息（改成你自己的） ----------
title: 我的博客
subtitle: 记录与分享
description: 我的个人博客
keywords: 博客
author: earlySept
language: zh-CN
timezone: Asia/Shanghai

# ---------- 网址（部署在 earlySept/Blog 仓库的 GitHub Pages 上） ----------
url: https://earlySept.github.io/Blog
root: /Blog/
permalink: :year/:month/:day/:title/
permalink_defaults:

# ---------- 目录结构（一般不用动） ----------
source_dir: source
public_dir: public
tag_dir: tags
archive_dir: archives
category_dir: categories
code_dir: downloads/code
i18n_dir: :lang
skip_render:

# ---------- 文章设置（一般不用动） ----------
new_post_name: :title.md
default_layout: post
titlecase: false
external_link:
  enable: true
  field: site
  exclude: ""
filename_case: 0
render_drafts: false
post_asset_folder: false
relative_link: false
future: true
syntax_highlighter: highlight.js

# ---------- 默认分类（不用动） ----------
default_category: 未分类

# ---------- 本地预览服务器（npm run server → http://localhost:4000） ----------
server:
  port: 4000

# ---------- 站内搜索（配合 Fluid 主题，无需改动） ----------
search:
  path: local-search.xml
  field: post
  content: true
  format: html

# ---------- 主题 ----------
theme: fluid

# 说明：网页由 GitHub Actions 自动构建发布（见 .github/workflows/deploy.yml），
# 无需在本机执行任何部署命令。
